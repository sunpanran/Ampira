<!doctype html>
<html lang="zh-CN" data-color-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ampira calendar fixtures</title>
  <link rel="stylesheet" href="../../assets/dashboard.css">
  <style>
    body { min-width: 0; padding: 24px; }
    #calendarFixture { width: min(800px, 100%); margin: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
    @media (max-width: 820px) { body { padding: 12px; } #calendarFixture { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <main id="calendarFixture" class="has-dashboard-layout"></main>
  <script type="module" src="./calendar.mjs"></script>
</body>
</html>
